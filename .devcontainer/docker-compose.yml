version: '3.8'

services:
  fireball-dev:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: fireball-dev:latest
    container_name: fireball-dev
    volumes:
      - ..:/workspaces/fireball
    working_dir: /workspaces/fireball
    # Keep the container running
    command: /bin/sh -c "while sleep 1000; do :; done"
    # User matches the Dockerfile
    user: developer
    # Network configuration (optional, usually default is fine)
    network_mode: bridge
