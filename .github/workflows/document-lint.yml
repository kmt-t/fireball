name: Document Lint and Consistency Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.11'

    - name: Run Mechanical Audits
      run: |
        ./tools/run_all_tests.sh
