name: Document Quality & Verification Pipeline

on:
  # Disabled: doc_cache.db (the committed LLM-audit evidence this pipeline's
  # Obligation Gate reads) is no longer tracked in git (repo-size cleanup;
  # its history was purged separately). A fresh CI checkout has no audit
  # evidence, so `./tools/run_all_tests.sh` would fail every
  # {VERIFY_LLM}-tagged document with OBLIG-JUDGE-MISSING regardless of
  # whether the audit ever actually ran. Automatic triggers are removed
  # until that's addressed; workflow_dispatch is kept for manual runs.
  workflow_dispatch:

jobs:
  lint:
    name: Spec Quality Gates & Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        # Full history so `origin/<base>` is resolvable below — a PR checkout
        # otherwise only fetches the merge commit, not the base branch's ref.
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: '3.11'

    - name: Ensure script execution permissions
      run: |
        chmod +x tools/*.sh

    - name: Run Document & Source Quality Gates
      run: |
        ./tools/check-doc.sh
        ./tools/check-src.sh -g all

    - name: LLM Semantic Audit (changed subgraphs only)
      # PR-only: the comparison needs a base-branch lockfile to diff against.
      # This is a fast, independent smoke check on the sections this PR
      # actually touches. SPEC_INTEGRATOR_DB_PATH points it at a scratch DB so
      # it cannot wholesale-replace the committed cache DB, which stays the
      # full audit maintained by `spec-integrator sync` + a full `llm-judge`
      # run locally, per tools/README.md.
      # `llm-judge` always also runs the whole-document audit and the Design ->
      # Test Spec -> Test Code chain audit alongside the subgraph one, and
      # neither has a --changed-only equivalent (each always covers whichever
      # documents/components it evaluates) -- so --max-documents/--max-targets
      # cap them low here to keep this specific check cheap.
      if: github.event_name == 'pull_request' && env.SAKURA_API_KEY != ''
      env:
        SAKURA_API_KEY: ${{ secrets.SAKURA_API_KEY }}
        SPEC_INTEGRATOR_DB_PATH: /tmp/pr_changed_audit_cache.db
      run: |
        git show "origin/${{ github.base_ref }}:spec-consistency.lock" > /tmp/base.lock
        uv run --project tools/spec-integrator python -m spec_integrator.cli llm-judge \
          --config spec-integrator.yaml --backend sakura \
          --changed-only --baseline /tmp/base.lock --min-references 0 \
          --max-documents 1 --max-targets 1 \
          | tee /tmp/pr_changed_audit.txt

    - name: Publish Summary to Step Summary
      if: always()
      run: |
        if [ -f reports/doc_report.md ]; then
          cat reports/doc_report.md >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f /tmp/pr_changed_audit.txt ]; then
          echo -e "\n## LLM Semantic Audit (Changed Subgraphs)\n" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/pr_changed_audit.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Verification Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spec-verification-reports
        path: |
          reports/doc_report.md
          /tmp/pr_changed_audit.txt
        if-no-files-found: ignore
