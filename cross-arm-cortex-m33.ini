[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'arm-none-eabi-ar'
strip = 'arm-none-eabi-strip'
exe_wrapper = ['/workspace/tools/run_qemu.sh', 'cortex-m33']

[properties]
picolibc_root = '/usr/lib/picolibc/arm-none-eabi'
gcc_root = '/usr/lib/gcc/arm-none-eabi/13.2.1'
cpp_header_root = '/usr/include/newlib/c++/13.2.1'
arch_lib_path = 'thumb/v8-m.main/nofp'

c_args = ['-target', 'arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '--sysroot=' + picolibc_root, '-isystem', picolibc_root + '/include', '-isystem', gcc_root + '/include', '-fno-exceptions', '-ffunction-sections', '-fdata-sections']
cpp_args = ['-target', 'arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '--sysroot=' + picolibc_root, '-isystem', picolibc_root + '/include', '-isystem', gcc_root + '/include', '-isystem', cpp_header_root, '-isystem', cpp_header_root + '/arm-none-eabi', '-fno-exceptions', '-fno-rtti', '-ffunction-sections', '-fdata-sections']

c_link_args = ['-target', 'arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '--sysroot=' + picolibc_root, '-fuse-ld=lld', '-Wl,--gc-sections', '-nostartfiles', '-static', '-L' + picolibc_root + '/lib/' + arch_lib_path, '-L' + gcc_root + '/' + arch_lib_path, '-T', '/workspace/tools/zephyr_arm_lld.ld', picolibc_root + '/lib/' + arch_lib_path + '/crt0-semihost.o', '-lc', '-lm', '-lgcc', '-lsemihost', '-Wl,--entry=_start', '-Wl,--defsym=_fini=0', '-Wl,--defsym=__flash=0x10000000', '-Wl,--defsym=__flash_size=0x400000', '-Wl,--defsym=__ram=0x38000000', '-Wl,--defsym=__ram_size=0x400000']
cpp_link_args = ['-target', 'arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '--sysroot=' + picolibc_root, '-fuse-ld=lld', '-Wl,--gc-sections', '-nostartfiles', '-nostdlib++', '-static', '-L' + picolibc_root + '/lib/' + arch_lib_path, '-L' + gcc_root + '/' + arch_lib_path, '-T', '/workspace/tools/zephyr_arm_lld.ld', picolibc_root + '/lib/' + arch_lib_path + '/crt0-semihost.o', '-lc', '-lm', '-lgcc', '-lsemihost', '-Wl,--entry=_start', '-Wl,--defsym=_fini=0', '-Wl,--defsym=__flash=0x10000000', '-Wl,--defsym=__flash_size=0x400000', '-Wl,--defsym=__ram=0x38000000', '-Wl,--defsym=__ram_size=0x400000']

[host_machine]
system = 'none'
cpu_family = 'arm'
cpu = 'cortex-m33'
endian = 'little'
