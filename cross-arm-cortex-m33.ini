[binaries]
c = 'clang'
cpp = 'clang++'
c_ld = 'lld'
cpp_ld = 'lld'
exe_wrapper = ['bash', '/workspace/tools/run_qemu.sh', 'cortex-m33']

[properties]
c_args = ['-target', 'arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '--sysroot=/usr/lib/arm-none-eabi', '-fno-exceptions']
cpp_args = ['-target', 'arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '--sysroot=/usr/lib/arm-none-eabi', '-stdlib=libstdc++', '-I/usr/include/newlib/c++/13.2.1', '-I/usr/include/newlib/c++/13.2.1/arm-none-eabi', '-fno-exceptions', '-fno-rtti']
c_link_args = ['-target', 'arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '--sysroot=/usr/lib/arm-none-eabi', '-static', '-L/usr/lib/arm-none-eabi/newlib/thumb/v8-m.main/nofp', '-L/usr/lib/gcc/arm-none-eabi/13.2.1/thumb/v8-m.main/nofp', '-L/workspace/tools', '-lc', '-lm', '-lgcc', '-lrdimon', '-lnosys', '-Wl,--entry=_start', '-Wl,--defsym=_fini=0', '-fno-exceptions', '-rtlib=libgcc']
cpp_link_args = ['-target', 'arm-none-eabi', '-mcpu=cortex-m33', '-mthumb', '--sysroot=/usr/lib/arm-none-eabi', '-stdlib=libstdc++', '-static', '-L/usr/lib/arm-none-eabi/newlib/thumb/v8-m.main/nofp', '-L/usr/lib/gcc/arm-none-eabi/13.2.1/thumb/v8-m.main/nofp', '-L/workspace/tools', '-lc', '-lm', '-lgcc', '-lstdc++', '-lrdimon', '-lnosys', '-lunwind', '-Wl,--entry=_start', '-Wl,--defsym=_fini=0', '-fno-exceptions', '-fno-rtti', '-rtlib=libgcc']

[host_machine]
system = 'none'
cpu_family = 'arm'
cpu = 'cortex-m33'
endian = 'little'
