[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'riscv64-unknown-elf-ar'
strip = 'riscv64-unknown-elf-strip'
exe_wrapper = ['/workspace/tools/run_qemu.sh', 'riscv32']

[properties]
picolibc_root = '/usr/lib/picolibc/riscv64-unknown-elf'
gcc_root = '/usr/lib/gcc/riscv64-unknown-elf/13.2.0'
zephyr_sdk_riscv = '/opt/zephyr-sdk-0.16.8/riscv64-zephyr-elf/riscv64-zephyr-elf'
zephyr_sdk_riscv_picolibc = '/opt/zephyr-sdk-0.16.8/riscv64-zephyr-elf/picolibc/riscv64-zephyr-elf'
cpp_header_root = zephyr_sdk_riscv + '/include/c++/12.2.0'
cpp_header_arch = cpp_header_root + '/riscv64-zephyr-elf/rv32im_zicsr_zifencei/ilp32'
arch_lib_path = 'rv32i/ilp32'
zephyr_lib_path = 'rv32im_zicsr_zifencei/ilp32'

c_args = ['-target', 'riscv32-unknown-elf', '-march=rv32i', '-mabi=ilp32', '--sysroot=' + picolibc_root, '-isystem', picolibc_root + '/include', '-isystem', gcc_root + '/include', '-fno-exceptions', '-ftls-model=local-exec', '-ffunction-sections', '-fdata-sections']
cpp_args = ['-target', 'riscv32-unknown-elf', '-march=rv32i', '-mabi=ilp32', '--sysroot=' + picolibc_root, '-isystem', picolibc_root + '/include', '-isystem', gcc_root + '/include', '-isystem', cpp_header_root, '-isystem', cpp_header_arch, '-fno-exceptions', '-fno-rtti', '-ftls-model=local-exec', '-ffunction-sections', '-fdata-sections']
c_link_args = ['-target', 'riscv32-unknown-elf', '-march=rv32i', '-mabi=ilp32', '--sysroot=' + picolibc_root, '-fuse-ld=lld', '-Wl,--gc-sections', '-nostartfiles', '-static', '-L' + picolibc_root + '/lib/' + arch_lib_path, '-L' + gcc_root + '/' + arch_lib_path, '-T', '/workspace/tools/zephyr_riscv_lld.ld', picolibc_root + '/lib/' + arch_lib_path + '/crt0-semihost.o', '-lc', '-lm', '-lgcc', '-lsemihost', '-Wl,--defsym=__flash=0x80000000', '-Wl,--defsym=__flash_size=0x1000000', '-Wl,--defsym=__ram=0x80200000', '-Wl,--defsym=__ram_size=0x1000000', '-Wl,--defsym=__stack=0x80400000']
cpp_link_args = ['-target', 'riscv32-unknown-elf', '-march=rv32i', '-mabi=ilp32', '--sysroot=' + picolibc_root, '-fuse-ld=lld', '-Wl,--gc-sections', '-nostartfiles', '-nostdlib++', '-static', '-L' + picolibc_root + '/lib/' + arch_lib_path, '-L' + gcc_root + '/' + arch_lib_path, '-L' + zephyr_sdk_riscv_picolibc + '/lib/' + zephyr_lib_path, '-T', '/workspace/tools/zephyr_riscv_lld.ld', picolibc_root + '/lib/' + arch_lib_path + '/crt0-semihost.o', '-lstdc++', '-lc', '-lm', '-lgcc', '-lsemihost', '-Wl,--defsym=__flash=0x80000000', '-Wl,--defsym=__flash_size=0x1000000', '-Wl,--defsym=__ram=0x80200000', '-Wl,--defsym=__ram_size=0x1000000', '-Wl,--defsym=__stack=0x80400000']

[host_machine]
system = 'none'
cpu_family = 'riscv'
cpu = 'riscv32'
endian = 'little'
