[project]
name = "fireball-dev-environment"
version = "0.1.0"
description = "Development and validation dependencies for Fireball and PySIM"
requires-python = ">=3.13,<3.14"

[dependency-groups]
# Shared repository tools used by source, document, and matrix verification.
shared = [
  "pymodelchecking>=1.3.4",
  "mistune>=3.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "urllib3>=2.0.0",
  "mermaidx>=0.9.4",
  "ruff>=0.16.8",
  "pyright>=1.1.390",
]
# Test framework packages shared by the unit, integration, and workload suites.
qa-shared = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "hypothesis>=6.0",
]
# External WASM reference oracle required by QA, never by the product runtime.
qa-private = ["wasmtime>=14.0.0"]
# Measurement and translation tools that are only needed for benchmarks.
benchmark-private = ["pythran>=0.19.0", "line-profiler>=4.1.0"]
# Keep `uv sync` convenient while allowing narrower QA-only installs.
dev = [
  { include-group = "shared" },
  { include-group = "qa-shared" },
  { include-group = "qa-private" },
  { include-group = "benchmark-private" },
]

[tool.uv]
package = false
