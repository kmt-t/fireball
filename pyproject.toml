[project]
name = "fireball-dev-environment"
version = "0.1.0"
description = "Development and validation dependencies for Fireball and PySIM"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pymodelchecking>=1.3.4",
  "mistune>=3.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "urllib3>=2.0.0",
  "mermaidx>=0.9.4",
  "wasmtime>=14.0.0",
  "pythran>=0.19.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.16.8",
  "line-profiler>=4.1.0",
  "pyright>=1.1.390",
]

[tool.uv]
package = false
