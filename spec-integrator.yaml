semantic_topic:
  enabled: true
  similarity_threshold: 0.85
  unlinked_warning_threshold: 0.88
  duplicate_warning_threshold: 0.93
  max_pairs: 1000
  embedding_model: "qwen3-embedding"
  batch_size: 16

prose_readability:
  max_sentence_characters: 100
  complex_sentence_min_characters: 90
  min_clause_links: 4

source_verification:
