version: "1.0"

project:
  name: "Fireball Hypervisor"
  docs_root: "docs"
  cache_db: ".spec-integrator/doc_cache.db"
  exclude_patterns:
    - "**/FORMAT.md"
    - "FORMAT.md"

tiers:
  - tier: 0
    name: "Requirements"
    path_pattern: 'requires/.*\.md'
    description: "システム最上位要求仕様書（Why）"

  - tier: 1
    name: "Primary Components"
    path_pattern: 'components/tier1_.*\.md'
    description: "粗粒度主要システムコンポーネント（What）"

  - tier: 2
    name: "Decomposed Subcomponents"
    path_pattern: 'components/tier2_.*\.md'
    description: "分解されたサブコンポーネント群（How - Subsystem）"

  - tier: 3
    name: "Leaf & Platform Components"
    path_pattern: 'components/tier3_.*\.md'
    description: "詳細リーフおよびプラットフォームコンポーネント（How - Leaf）"

  - tier: "meta"
    name: "Architecture & Plans"
    path_pattern: '(architecture|plans)/.*\.md'
    description: "全Tier横断メタ設計・開発計画"

  - tier: "meta"
    name: "Cross-cutting Physical Specs & Catalogs"
    path_pattern: 'specs/.*\.md'
    description: "全Tier横断・具象物理規格カタログ（WASM命令セット、WASI ABI、GDB RSP、JITステンシル等）。各ファイル冒頭の「アーキテクチャ分類」セクションで個別にTierラベルを自己申告するが、複数Tierから横断参照される性質上、Hierarchy Gateの逆流判定対象からはmeta同様に除外する。"

  - tier: "meta"
    name: "Quality Assurance & Test Specifications"
    path_pattern: 'qa/.*\.md'
    description: "全Tier横断のテスト仕様書および品質証跡。"

formal_verification:
  model_dir_name: "formal"
  tag: "{VERIFY_FORMAL}"
  timeout_seconds: 30

wit_verification:
  wit_dir_name: "wit"
  tag: "{VERIFY_WIT}"

benchmark_verification:
  benchmark_dir_name: "benchmarks"
  tag: "{VERIFY_BENCHMARK}"

obligation:
  require_full_coverage: true

verification_matrix:
  enabled: true
  strict: true
  product:
    document: "docs/qa/product_verification_matrix.md"
    component_root: "docs/components"
    test_spec_root: "docs/qa"
    expected:
      component_specs: 26
      concept_files: 15
      formal_models: 23
      test_specs: 25
  pysim:
    document: "experiments/pysim/qa/verification_matrix.md"
    qa_root: "experiments/pysim/qa"
    factor_csv: "experiments/pysim/qa/pairwise_factors.csv"
    scenario_dir: "experiments/pysim/qa/scenarios"
    scenario_runner: "experiments/pysim/qa/scenarios/run_all.py"
    unit_runner: "experiments/pysim/qa/run_all.py"
    integration_dir: "experiments/pysim/qa/integration"
    integration_runner: "experiments/pysim/qa/integration/run_all.py"
    workload_dir: "experiments/pysim/qa/workloads"
    workload_runner: "experiments/pysim/qa/workloads/run_all.py"
    pairwise_test: "experiments/pysim/qa/integration/test_pairwise_combinations.py"
    expected:
      unit_suites: 30
      integration_suites: 4
      workload_suites: 3
      scenarios: 12
      pairwise_factors: 7
      pairwise_cases: 26
      pairwise_interactions: 288

consistency:
  enabled: true
  symbol_patterns:
    - '\bFB_CONF_[A-Z0-9_]+\b'
    - '\bFB_[A-Z0-9_]+_(?:MAX|MIN|SIZE|BASE|LIMIT)\b'
  extra_scan_globs:
    - "inc/**/*.hxx"
    - "inc/*.hxx"

evidence:
  # reports/doc_report.md is gitignored: the pipeline generates it as its own
  # LAST step, so on a fresh checkout it legitimately does not exist yet.
  # backlog_list.md / roadmap_phase.md point readers at it as "where the
  # latest results will be", not as a claim that it already exists.
  ignore_artifact_refs:
    - "reports/doc_report.md"

llm_judge:
  tag: "{VERIFY_LLM}"
  default_backend: "nimble"
  error_score_threshold: 0.70
  backends:
    jev:
      api_key_env: "OPENROUTER_API_KEY"
      endpoint: "https://openrouter.ai/api/alpha/decisions"
      model: "typesafe/jev-1.13"
    nimble:
      endpoint: "http://10.180.25.1:11434/v1/systemone"
      model: "nimble-v3:9b-q4_K_M"
      requires_api_key: false
      context_window_tokens: 32768
  checks:
    - id: "vertical_consistency"
      name: "Vertical Consistency (Definition vs. Designs)"
      mode: ["link_pair"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/vertical_consistency.prompt"

    - id: "keyword_definition_integrity"
      name: "Keyword Definition Source, Placement, and Meaning"
      mode: ["link_pair"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/keyword_definition_integrity.prompt"

    - id: "keyword_reference_traceability"
      name: "Keyword Reference Role and Traceability Links"
      mode: ["link_pair"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/keyword_reference_traceability.prompt"

    - id: "numeric_agreement"
      name: "Numeric Agreement & Arithmetic"
      mode: ["single", "link_pair"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/numeric_agreement.prompt"

    - id: "clarity_completeness"
      name: "Clarity & Unresolved Ambiguity"
      mode: ["single", "link_pair"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/clarity_completeness.prompt"

    - id: "obvious_typos_omissions"
      name: "Obvious Typos and Missing Text"
      mode: ["single", "link_pair"]
      enabled: true
      severity: "WARNING"
      prompt_file: "tools/spec-integrator/prompts/checks/obvious_typos_omissions.prompt"

    - id: "readability_structure"
      name: "Readable Procedure, Main-Line, and Supplementary-Condition Structure"
      mode: ["single", "link_pair"]
      enabled: true
      severity: "WARNING"
      prompt_file: "tools/spec-integrator/prompts/checks/readability_structure.prompt"

    - id: "natural_language_standards"
      name: "Japanese Natural Language Standard"
      mode: ["single", "link_pair"]
      enabled: true
      severity: "WARNING"
      prompt_file: "tools/spec-integrator/prompts/checks/natural_language_standards.prompt"

    - id: "diagram_standards"
      name: "Mermaid Diagram Appropriateness"
      mode: ["single", "link_pair"]
      enabled: true
      severity: "WARNING"
      prompt_file: "tools/spec-integrator/prompts/checks/diagram_standards.prompt"

    - id: "claim_substantiation"
      name: "Claim-Evidence Substantiation & Unbacked Assertions"
      mode: ["single", "link_pair"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/claim_substantiation.prompt"

    - id: "reference_by_keyword_or_filename"
      name: "Reference by Keyword or File Path Only (No Fragile Chapter/Section Numbers)"
      mode: ["single", "link_pair"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/reference_by_keyword_or_filename.prompt"

    - id: "redundancy_and_duplication"
      name: "Redundancy & Duplication Audit (Permit Multi-perspective Descriptions)"
      mode: ["link_pair"]
      enabled: true
      severity: "WARNING"
      prompt_file: "tools/spec-integrator/prompts/checks/redundancy_and_duplication.prompt"

embeddings:
  endpoint: "http://10.180.25.1:11434"

