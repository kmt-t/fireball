version: "1.0"

project:
  name: "Fireball Hypervisor"
  docs_root: "docs"
  cache_db: ".spec-integrator/doc_cache.db"
  exclude_patterns:
    - "**/FORMAT.md"
    - "FORMAT.md"

tiers:
  - tier: 0
    name: "Requirements"
    path_pattern: 'requires/.*\.md'
    description: "システム最上位要求仕様書（Why）"

  - tier: 1
    name: "Primary Components"
    path_pattern: 'components/tier1_.*\.md'
    description: "粗粒度主要システムコンポーネント（What）"

  - tier: 2
    name: "Decomposed Subcomponents"
    path_pattern: 'components/tier2_.*\.md'
    description: "分解されたサブコンポーネント群（How - Subsystem）"

  - tier: 3
    name: "Leaf & Platform Components"
    path_pattern: 'components/tier3_.*\.md'
    description: "詳細リーフおよびプラットフォームコンポーネント（How - Leaf）"

  - tier: "meta"
    name: "Architecture & Plans"
    path_pattern: '(architecture|plans)/.*\.md'
    description: "全Tier横断メタ設計・開発計画"

keywords:
  meta:
    pattern: "^META_[A-Za-z0-9_]+$"
    defined_in: '(architecture/document_structure|architecture/keyword_dictionary)\.md'
  global:
    pattern: "^GLOBAL_[A-Za-z0-9_]+$"
    defined_in: '(architecture/document_structure|architecture/keyword_dictionary)\.md'
  local:
    # Allows hyphens: the established GOTCHA-ID convention used throughout
    # every test spec (SCHED-GOTCHA-01, DBG-GOTCHA-01, LOAD-GOTCHA-01, ...)
    # is hyphenated, not underscored -- without this, every such keyword is
    # structurally unable to ever resolve as "defined" regardless of where
    # it's registered in keyword_dictionary.md.
    pattern: "^[A-Za-z0-9_-]+$"
    defined_in: '(requires/.*|architecture/keyword_dictionary)\.md'

formal_verification:
  model_dir_name: "formal"
  tag: "{VERIFY_FORMAL}"
  timeout_seconds: 30

wit_verification:
  wit_dir_name: "wit"
  tag: "{VERIFY_WIT}"

benchmark_verification:
  benchmark_dir_name: "benchmarks"
  tag: "{VERIFY_BENCHMARK}"

obligation:
  require_full_coverage: false
  stale_is_error: false

consistency:
  enabled: true
  symbol_patterns:
    - '\bFB_CONF_[A-Z0-9_]+\b'
    - '\bFB_[A-Z0-9_]+_(?:MAX|MIN|SIZE|BASE|LIMIT)\b'
  extra_scan_globs:
    - "inc/**/*.hxx"
    - "inc/*.hxx"

evidence:
  # reports/doc_report.md is gitignored: the pipeline generates it as its own
  # LAST step, so on a fresh checkout it legitimately does not exist yet.
  # backlog_list.md / roadmap_phase.md point readers at it as "where the
  # latest results will be", not as a claim that it already exists.
  ignore_artifact_refs:
    - "reports/doc_report.md"

llm_judge:
  tag: "{VERIFY_LLM}"
  default_backend: "sakura"
  backends:
    sakura:
      api_key_env: "SAKURA_API_KEY"
      model: "preview/Qwen3.6-35B-A3B"
    openrouter:
      api_key_env: "OPENROUTER_API_KEY"
  checks:
    - id: "vertical_consistency"
      name: "Vertical Consistency (Definition vs. Designs)"
      mode: ["cluster"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/vertical_consistency.prompt"

    - id: "cross_doc_consistency"
      name: "Cross-Document Consistency (Pairwise Drift & Mismatches)"
      mode: ["cluster"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/cross_doc_consistency.prompt"

    - id: "internal_consistency"
      name: "Internal Document Consistency"
      mode: ["single"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/internal_consistency.prompt"

    - id: "numeric_agreement"
      name: "Numeric Agreement & Arithmetic"
      mode: ["single", "cluster"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/numeric_agreement.prompt"

    - id: "clarity_completeness"
      name: "Clarity & Unresolved Ambiguity"
      mode: ["single", "cluster"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/clarity_completeness.prompt"

    - id: "natural_language_standards"
      name: "Japanese Natural Language Standard"
      mode: ["single", "cluster"]
      enabled: true
      severity: "WARNING"
      prompt_file: "tools/spec-integrator/prompts/checks/natural_language_standards.prompt"

    - id: "diagram_standards"
      name: "Mermaid Diagram Appropriateness"
      mode: ["single", "cluster"]
      enabled: true
      severity: "WARNING"
      prompt_file: "tools/spec-integrator/prompts/checks/diagram_standards.prompt"

    - id: "claim_substantiation"
      name: "Claim-Evidence Substantiation & Unbacked Assertions"
      mode: ["single", "cluster"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/claim_substantiation.prompt"

    - id: "reference_by_keyword_or_filename"
      name: "Reference by Keyword or File Path Only (No Fragile Chapter/Section Numbers)"
      mode: ["single", "cluster"]
      enabled: true
      severity: "ERROR"
      prompt_file: "tools/spec-integrator/prompts/checks/reference_by_keyword_or_filename.prompt"

    - id: "rationale_over_history"
      name: "Design Rationale Over Chronological History"
      mode: ["single", "cluster"]
      enabled: true
      severity: "WARNING"
      prompt_file: "tools/spec-integrator/prompts/checks/rationale_over_history.prompt"

    - id: "redundancy_and_duplication"
      name: "Redundancy & Duplication Audit (Permit Multi-perspective Descriptions)"
      mode: ["cluster"]
      enabled: true
      severity: "WARNING"
      prompt_file: "tools/spec-integrator/prompts/checks/redundancy_and_duplication.prompt"

