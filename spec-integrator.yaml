version: "1.0"

project:
  name: "Fireball Hypervisor"
  docs_root: "docs"
  cache_db: ".spec-integrator/doc_cache.db"
  exclude_patterns:
    - "**/FORMAT.md"
    - "FORMAT.md"

tiers:
  - tier: 0
    name: "Requirements"
    path_pattern: 'requires/.*\.md'
    description: "システム最上位要求仕様書（Why）"

  - tier: 1
    name: "Primary Components"
    path_pattern: 'components/tier1_.*\.md'
    description: "粗粒度主要システムコンポーネント（What）"

  - tier: 2
    name: "Decomposed Subcomponents"
    path_pattern: 'components/tier2_.*\.md'
    description: "分解されたサブコンポーネント群（How - Subsystem）"

  - tier: 3
    name: "Leaf & Platform Components"
    path_pattern: 'components/tier3_.*\.md'
    description: "詳細リーフおよびプラットフォームコンポーネント（How - Leaf）"

  - tier: "meta"
    name: "Architecture & Plans"
    path_pattern: '(architecture|plans)/.*\.md'
    description: "全Tier横断メタ設計・開発計画"

keywords:
  meta:
    pattern: "^META_[A-Za-z0-9_]+$"
    defined_in: '(architecture/document_structure|architecture/keyword_dictionary)\.md'
  global:
    pattern: "^GLOBAL_[A-Za-z0-9_]+$"
    defined_in: '(architecture/document_structure|architecture/keyword_dictionary)\.md'
  local:
    pattern: "^[A-Za-z0-9_]+$"
    defined_in: '(requires/.*|architecture/keyword_dictionary)\.md'

formal_verification:
  model_dir_name: "formal"
  tag: "{VERIFY_FORMAL}"
  timeout_seconds: 30

wit_verification:
  wit_dir_name: "wit"
  tag: "{VERIFY_WIT}"

benchmark_verification:
  benchmark_dir_name: "benchmarks"
  tag: "{VERIFY_BENCHMARK}"

obligation:
  require_full_coverage: false

evidence:
  # reports/doc_report.md is gitignored: the pipeline generates it as its own
  # LAST step, so on a fresh checkout it legitimately does not exist yet.
  # backlog_list.md / roadmap_phase.md point readers at it as "where the
  # latest results will be", not as a claim that it already exists.
  ignore_artifact_refs:
    - "reports/doc_report.md"

llm_judge:
  tag: "{VERIFY_LLM}"
  default_backend: "sakura"
  backends:
    sakura:
      api_key_env: "SAKURA_API_KEY"
      model: "preview/Qwen3.6-35B-A3B"
    openrouter:
      api_key_env: "OPENROUTER_API_KEY"
      endpoint: "https://openrouter.ai/api/v1/chat/completions"
      model: "qwen/qwen3.8-27b"
    ollama:
      endpoint: "http://localhost:11434"
      model: "llama3"

risk_assessment:
  heuristic:
    # 形式検証 (pyModelChecking) 義務を導出するキーワード
    formal_triggers:
      - "rendezvous"
      - "deadlock"
      - "csp"
      - "handoff"
      - "zero-copy"
      - "ownership transfer"
      - "w^x"
      - "mpu"
      - "consecutive_handoffs"
      - "access control matrix"
      - "role_matrix"
      - "page table walk"
    # LLM 意味監査 義務を導出するキーワード
    llm_triggers:
      - "adr"
      - "trade-off"
      - "rationale"
      - "design decision"
      - "トレードオフ"
      - "設計判断"
      - "選択理由"
      - "設計課題"
      - "採用理由"
      - "根拠"
    # 形式検証の対象外とする Tier
    non_formal_tiers:
      - 0
      - "meta"
    # 形式検証の対象外とするパス（計画・予算・アーキテクチャ俯瞰・テスト仕様書等）
    non_formal_path_patterns:
      - 'plans/.*\.md'
      - 'requires/.*\.md'
      - 'architecture/.*\.md'
      - 'specs/.*\.md'
      - 'resource_budget\.md'
      - '.*/tests/.*\.md'
    # 宣言的表・非実行定義セクションの明示的免除ルール（Waivers）
    waivers:
      - section_pattern: 'components/tier1_core/system_config\.md'
        heading_pattern: '^3\.3\.1 メモリ管理'
        rationale: "メモリ設定定数の静的宣言テーブルであり、並行状態遷移を含まないため"
        authorized_at: "2026-08-30"
      - section_pattern: 'components/tier1_core/system_syscall\.md'
        heading_pattern: '^5\.(1|6)\.'
        rationale: "システムコール番号およびカテゴリの静的テーブル定義であり、状態遷移を含まないため"
        authorized_at: "2026-08-22"
      - section_pattern: 'components/tier1_interface/system_service\.md'
        heading_pattern: '^(WASI呼び出しシーケンス|4\.4 WASI API から HAL への変換ラッパー|6\.1 性能制約と方策)'
        rationale: "WASI APIからHALへの1対1同期委譲ラッパーおよびシーケンス記述であり、状態並行性モデルの対象外"
        authorized_at: "2026-08-22"
      - section_pattern: 'components/tier2_runtime/runtime_loader\.md'
        heading_pattern: '^4\.1 アルゴリズム'
        rationale: "WASMバイナリヘッダの直列パース手順であり、並行通信を含まないため"
        authorized_at: "2026-08-22"
      - section_pattern: 'components/tier1_interface/interface_wit\.md'
        heading_pattern: '^リカバリー戦略の事前・事後条件と不変条件'
        rationale: "WITインターフェイスにおける静的エラー回復契約の記述であり、pyModelChecking の対象外"
        authorized_at: "2026-08-22"
      - section_pattern: '.*'
        heading_pattern: '^(用語定義|変更履歴|カテゴリ一覧|性能制約|設計判断)'
        rationale: "非実行・静的テーブル・宣言的インターフェイス定義"
        authorized_at: "2026-08-22"
      - section_pattern: 'components/.*/concepts/README\.md'
        heading_pattern: '.*'
        rationale: "コンセプトコードの所在を示す索引ページであり、仕様記述も状態遷移も含まない。検証対象は参照先の *.py 本体"
        authorized_at: "2026-08-22"
      - section_pattern: 'requires/.*\.md'
        heading_pattern: '.*'
        rationale: "Tier 0 最上位要求仕様書（命題一覧・ユースケース定義）であり、コンポーネント設計書の意味監査対象外"
        authorized_at: "2026-08-24"
      - section_pattern: 'plans/.*\.md'
        heading_pattern: '.*'
        rationale: "開発計画・バックログ・ロードマップであり、設計仕様書の意味監査対象外"
        authorized_at: "2026-08-24"
      - section_pattern: 'architecture/.*\.md'
        heading_pattern: '.*'
        rationale: "Tier meta アーキテクチャ俯瞰設計書であり、個別コンポーネントのLLM意味監査対象外"
        authorized_at: "2026-08-24"
      - section_pattern: 'components/tier3_platform/platform_memory\.md'
        heading_pattern: '^8\.'
        rationale: "メモリマネージャの設計変更・判断の静的記録"
        authorized_at: "2026-08-24"
      - section_pattern: 'components/tier1_interface/system_service\.md'
        heading_pattern: '^(設計判断|6\.)'
        rationale: "サービス層の静的設計判断"
        authorized_at: "2026-08-24"
      - section_pattern: 'components/tier2_runtime/runtime_loader\.md'
        heading_pattern: '^4\.2'
        rationale: "ローダの静的メモリ制約定義"
        authorized_at: "2026-08-24"

fake_decision_detector:
  # 地の文での勝手な仕様決定（独断）をスキャンする正規表現パターン
  prose_decision_patterns:
    - '(?:設計方針|アーキテクチャ方針|基本方針|決定事項として|方針として|設計判断として)[：:]?\s*([^。\n]{15,120}[。])'
    - '(?:を採用する|に固定する|を禁止する|はサポート外とする|は不可とする|と決定した)[。]'
  # LLM 監査候補となるセクション見出しトリガー
  section_heading_triggers:
    - "ADR"
    - "設計判断"
    - "方針"
    - "トレードオフ"
    - "制約"
    - "設計方針"
    - "決定"
  # LLM 監査候補となる本文トリガー
  body_text_triggers:
    - "**決定事項**:"
    - "ADR-"
    - "トレードオフ"
    - "設計方針"
    - "アーキテクチャ方針"
    - "方針として"
    - "判断として"
    - "決定する"
    - "固定する"
    - "採用する"
    - "禁止する"
  # 明示的ローカル決定ブロック（ADR）の形式定義
  inline_decision_pattern: '-\s*\*\*決定事項\*\*:\s*`?\{(ADR_[A-Za-z0-9_]+)\}`?'
  heading_adr_pattern: '^(#{2,6})\s*(ADR[-_][A-Za-z0-9_\-]+)\s*[:：]'
  option_header_pattern: '\*\*選択肢(?:と評価)?\*\*'
  option_entry_pattern: '案\s*(\d+)\s*[:：]'
  conclusion_pattern: '\*\*結論\*\*[:：].*?案\s*(\d+)'
  # 藁人形判定の閾値
  strawman_min_ratio: 0.35
  strawman_abs_chars: 40
