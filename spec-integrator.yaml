      description: "C/C++ core hypervisor and platform code"
      include_dirs: ["inc", "src", "experiments/pysim/native", "experiments/pysim/tier2_runtime/abi"]
      extensions: [".hxx", ".cxx", ".c", ".h", ".cpp"]
      formatters: ["clang-format"]
      checks:
        - id: "gate_checks"
          enabled: true
          rules: ["todo_comment", "empty_function", "dummy_return"]
        - id: "cpp_rules"
          enabled: true
          rules: ["forbidden_malloc", "forbidden_new", "forbidden_exceptions", "forbidden_rtti", "fireball_namespace"]
        - id: "complexity"
          enabled: true

    python_concepts:
      description: "Python reference concept implementations"
      include_dirs: ["docs"]
      patterns: ["*_concept.py"]
      formatters: ["ruff"]
      checks:
        - id: "ruff"
          enabled: true
        - id: "gate_checks"
          enabled: true
          rules: ["forbid_typing_any", "dummy_pass", "todo_comment"]
        - id: "execute"
          enabled: true

    python_formal:
      description: "pyModelChecking formal models"
      include_dirs: ["docs"]
      patterns: ["*_model.py", "formal/*.py"]
      formatters: ["ruff"]
      checks:
        - id: "ruff"
          enabled: true
        - id: "gate_checks"
          enabled: true
          rules: ["forbid_typing_any", "mutation_guards_required", "vacuous_property"]
        - id: "execute_formal"
          enabled: true

    python_pysim:
      description: "Python architectural simulator & test suites"
      include_dirs: ["experiments/pysim"]
      extensions: [".py"]
      formatters: ["ruff"]
      checks:
        - id: "ruff"
          enabled: true
        - id: "gate_checks"
          enabled: true
          rules: ["forbid_typing_any", "forbid_object_type", "forbid_non_none_union", "forbid_none_default_fill", "forbid_raise", "forbid_rtti", "forbid_test_backdoor", "forbid_required_nullable_arguments", "forbid_string_members", "dummy_pass", "todo_comment"]
          none_default_fill_exclude_paths:
            # Tests and benchmarks use None to select fixture or measurement helpers, not product defaults.
            - "experiments/pysim/qa/**"
            - "experiments/pysim/benchmarks/**"
          rtti_exclude_paths:
            - "experiments/pysim/qa/**"
            - "experiments/pysim/benchmarks/**"
          raise_exclude_paths:
            - "experiments/pysim/tier2_runtime/wasm/validation.py"
            - "experiments/pysim/qa/**"
            - "experiments/pysim/benchmarks/**"
          test_backdoor_exclude_paths:
            - "experiments/pysim/qa/**"
            - "experiments/pysim/benchmarks/**"
          forbidden_product_symbols:
            - "TraceBlock"
            - "compile_block"
            - "resolve_trace_block"
            - "emulate_trace"
          non_none_union_exclude_paths:
            - "experiments/pysim/qa/**"
            - "experiments/pysim/benchmarks/**"
          string_member_exclude_paths:
            - "experiments/pysim/tier2_runtime/observability/logger.py"
            - "experiments/pysim/qa/**"
            - "experiments/pysim/benchmarks/**"
          object_type_exclude_paths:
            - "experiments/pysim/qa/**"
            - "experiments/pysim/benchmarks/**"
        - id: "pysim_imports"
          enabled: true
        - id: "pysim_assert_side_effects"
          enabled: true
        - id: "run_tests"
          enabled: true
        - id: "complexity"
          enabled: true

pysim_imports:
  enabled: true
  root: "experiments/pysim"
  # 製品コードの各ファイルを、文書階層上のTierへ割り当てる正本。
  # qa/（統合シナリオを含む）、benchmarks/ は製品依存グラフの検査対象外とする。
  tiers:
    - tier: 1
      paths:
        - "tier1_core/**/*.py"
        - "tier1_interface/**/*.py"
        - "__init__.py"
    - tier: 2
      paths:
        - "tier2_runtime/**/*.py"
    - tier: 3
      paths:
        - "system.py"
        - "main.py"
        - "tier3_plugins/**/*.py"
        - "tier3_platform/**/*.py"
