semantic_topic:
  enabled: true
  similarity_threshold: 0.85
  unlinked_warning_threshold: 0.88
  duplicate_warning_threshold: 0.93
  max_pairs: 1000
  embedding_model: "multilingual-e5-large"
  backend: "sakura"
  batch_size: 16

source_verification:
  enabled: true
  groups:
    cpp:
      description: "C/C++ core hypervisor and platform code"
      include_dirs: ["inc", "src"]
      extensions: [".hxx", ".cxx", ".c", ".h", ".cpp"]
      formatters: ["clang-format"]
      checks:
        - id: "anti_sabotage"
          enabled: true
          rules: ["todo_comment", "empty_function", "dummy_return"]
        - id: "cpp_rules"
          enabled: true
          rules: ["forbidden_malloc", "forbidden_new", "forbidden_exceptions", "forbidden_rtti", "fireball_namespace"]

    python_concepts:
      description: "Python reference concept implementations"
      include_dirs: ["docs"]
      patterns: ["*_concept.py"]
      formatters: ["ruff"]
      checks:
        - id: "ruff"
          enabled: true
        - id: "anti_sabotage"
          enabled: true
          rules: ["forbid_typing_any", "dummy_pass", "todo_comment"]
        - id: "execute"
          enabled: true

    python_formal:
      description: "pyModelChecking formal models"
      include_dirs: ["docs"]
      patterns: ["*_model.py", "formal/*.py"]
      formatters: ["ruff"]
      checks:
        - id: "ruff"
          enabled: true
        - id: "anti_sabotage"
          enabled: true
          rules: ["forbid_typing_any", "mutation_guards_required", "vacuous_property"]
        - id: "execute_formal"
          enabled: true

    python_pysim:
      description: "Python architectural simulator & test suites"
      include_dirs: ["experiments/pysim"]
      extensions: [".py"]
      formatters: ["ruff"]
      checks:
        - id: "ruff"
          enabled: true
        - id: "anti_sabotage"
          enabled: true
          rules: ["forbid_typing_any", "dummy_pass", "todo_comment"]
        - id: "run_tests"
          enabled: true


