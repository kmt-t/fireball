version: "1.0"

project:
  name: "Fireball Hypervisor"
  docs_root: "docs"
  cache_db: ".spec-integrator/doc_cache.db"
  exclude_patterns:
    - "**/FORMAT.md"
    - "FORMAT.md"

tiers:
  - tier: 0
    name: "Requirements"
    path_pattern: 'requires/.*\.md'
    description: "システム最上位要求仕様書（Why）"

  - tier: 1
    name: "Primary Components"
    path_pattern: 'components/tier1_.*\.md'
    description: "粗粒度主要システムコンポーネント（What）"

  - tier: 2
    name: "Decomposed Subcomponents"
    path_pattern: 'components/tier2_.*\.md'
    description: "分解されたサブコンポーネント群（How - Subsystem）"

  - tier: 3
    name: "Leaf & Platform Components"
    path_pattern: 'components/tier3_.*\.md'
    description: "詳細リーフおよびプラットフォームコンポーネント（How - Leaf）"

  - tier: "meta"
    name: "Architecture & Plans"
    path_pattern: '(architecture|plans)/.*\.md'
    description: "全Tier横断メタ設計・開発計画"

keywords:
  meta:
    pattern: "^META_[A-Za-z0-9_]+$"
    defined_in: '(architecture/document_structure|architecture/keyword_dictionary)\.md'
  global:
    pattern: "^GLOBAL_[A-Za-z0-9_]+$"
    defined_in: '(architecture/document_structure|architecture/keyword_dictionary)\.md'
  local:
    pattern: "^[A-Za-z0-9_]+$"
    defined_in: '(requires/.*|architecture/keyword_dictionary)\.md'

formal_verification:
  model_dir_name: "formal"
  tag: "{VERIFY_FORMAL}"
  timeout_seconds: 30

wit_verification:
  wit_dir_name: "wit"
  tag: "{VERIFY_WIT}"

benchmark_verification:
  benchmark_dir_name: "benchmarks"
  tag: "{VERIFY_BENCHMARK}"

obligation:
  require_full_coverage: false

consistency:
  enabled: true
  lockfile: "spec-consistency.lock"
  cochange: true
  symbol_patterns:
    - '\bFB_CONF_[A-Z0-9_]+\b'
    - '\bFB_[A-Z0-9_]+_(?:MAX|MIN|SIZE|BASE|LIMIT)\b'
  extra_scan_globs:
    - "inc/**/*.hxx"
    - "inc/*.hxx"

evidence:
  # reports/doc_report.md is gitignored: the pipeline generates it as its own
  # LAST step, so on a fresh checkout it legitimately does not exist yet.
  # backlog_list.md / roadmap_phase.md point readers at it as "where the
  # latest results will be", not as a claim that it already exists.
  ignore_artifact_refs:
    - "reports/doc_report.md"

llm_judge:
  tag: "{VERIFY_LLM}"
  default_backend: "sakura"
  backends:
    sakura:
      api_key_env: "SAKURA_API_KEY"
      model: "preview/Qwen3.6-35B-A3B"
    openrouter:
      api_key_env: "OPENROUTER_API_KEY"
      endpoint: "https://openrouter.ai/api/v1/chat/completions"
      model: "qwen/qwen3.8-27b"
    ollama:
      endpoint: "http://localhost:11434"
      model: "llama3"
